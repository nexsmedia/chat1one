name: Build and Push Chatwoot Docker Image

on:
  push:
    branches: [ "develop" ]  # Cambia a "main" si es tu rama principal

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write  # Necesario para subir a GHCR
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/tu_usuario/tu_repo:latest
            ghcr.io/tu_usuario/tu_repo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max